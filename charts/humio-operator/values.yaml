operator:
  image:
    repository: humio/humio-operator
    tag: 0.27.1
    pullPolicy: IfNotPresent
    pullSecrets: []
  prometheus:
    serviceMonitor:
      enabled: false
  rbac:
    create: true
    allowManageRoles: true
    allowManageClusterRoles: true
  resources:
    limits:
      cpu: 250m
      memory: 200Mi
    requests:
      cpu: 250m
      memory: 200Mi
  watchNamespaces: []
  podAnnotations: {}

  nodeSelector: {}

  tolerations: []

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
            - amd64
          - key: kubernetes.io/os
            operator: In
            values:
            - linux

certmanager: true
defaultHumioCoreImage: ""
defaultHumioHelperImage: ""


pdfRenderService:
  enabled: true
  name: pdf-render-service
  port: 5123
  image:
    repository: registry.dodo.eyrie.cloud:5000/cloud/cs-pdf-render-service
    tag: 0.27.1
    pullPolicy: IfNotPresent
    pullSecrets: []
  annotations:
    iam.amazonaws.com/role: ""
  app: pdf-render-service
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/restricted-egress
                operator: In
                values:
                  - ""
  ingress:
    enabled: true
    hosts:
      - host: pdf-render-service-pool-main.red.dodo.eyrie.cloud
        port: 5123
    shared:
      enabled: false
  labels:
    attribution.crowdstrike.com/pag: nextgen-siem
    attribution.crowdstrike.com/pg: logscale-integration
    attribution.crowdstrike.com/pillar: platform
    attribution.crowdstrike.com/team: logscale-infrastructure
    attribution.crowdstrike.com/team-id: b169bdac-69a2-499d-a4a3-8fd611904ff5
  probes:
    livenessProbe:
      failureThreshold: 5
      httpGet:
        path: /health
        port: 5123
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 15
      successThreshold: 1
      timeoutSeconds: 60
    readinessProbe:
      failureThreshold: 1
      httpGet:
        path: /ready
        port: 5123
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 15
      successThreshold: 1
      timeoutSeconds: 60
  resources:
    limits:
      cpu: 4
      memory: 2Gi
    requests:
      cpu: 4
      memory: 1Gi
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 5123